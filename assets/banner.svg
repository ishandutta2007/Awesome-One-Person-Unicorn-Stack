<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="50%" stop-color="#0b0e1a"/>
      <stop offset="100%" stop-color="#05070d"/>
    </radialGradient>

    <linearGradient id="unicornGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#06b6d4;#3b82f6;#ec4899;#a855f7" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#3b82f6">
        <animate attributeName="stop-color" values="#3b82f6;#ec4899;#a855f7;#06b6d4;#3b82f6" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#a855f7;#ec4899;#3b82f6;#06b6d4" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.2)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(1deg); }
    }
    @keyframes floatRev {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(10px) rotate(-1deg); }
    }
    @keyframes pulseOrb {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.15); }
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Inter', sans-serif;
      font-weight: 800;
      letter-spacing: -1.5px;
    }
    .mono-pill {
      font-family: 'SF Mono', Monaco, 'Consolas', 'Courier New', monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .bg-card {
      opacity: 0.45;
      transition: opacity 0.3s;
    }
    .floating-1 {
      animation: floatSlow 6s ease-in-out infinite;
    }
    .floating-2 {
      animation: floatRev 7s ease-in-out infinite;
    }
    .pulsing-glow {
      animation: pulseOrb 5s ease-in-out infinite;
      transform-origin: center;
    }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="420" fill="url(#bgGlow)"/>

  <!-- Subtle Perspective Grid (Background) -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    
    <line x1="150" y1="0" x2="150" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="450" y1="0" x2="450" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="750" y1="0" x2="750" y2="420"/>
    <line x1="900" y1="0" x2="900" y2="420"/>
    <line x1="1050" y1="0" x2="1050" y2="420"/>
  </g>

  <!-- Animated Glowing Nebulas in Background -->
  <circle cx="280" cy="180" r="160" fill="#7928ca" filter="url(#glow)" class="pulsing-glow" />
  <circle cx="920" cy="220" r="180" fill="#0070f3" filter="url(#glow)" class="pulsing-glow" style="animation-delay: -2.5s;" />
  <circle cx="600" cy="80" r="140" fill="#ec4899" filter="url(#glow)" class="pulsing-glow" style="animation-delay: -1.2s;" />

  <!-- DYNAMIC BACKGROUND LAYER: Subtle Floating Tech Pills & Stack Cards (Low Opacity, Non-Obtrusive) -->
  <g id="dynamic-bg-elements">
    <!-- Left Floating Card 1: AI Agents -->
    <g class="floating-1 bg-card" transform="translate(60, 80)">
      <rect width="180" height="52" rx="10" fill="rgba(15, 23, 42, 0.7)" stroke="url(#cardBorder)" stroke-width="1.2"/>
      <circle cx="26" cy="26" r="10" fill="rgba(168, 85, 247, 0.2)"/>
      <text x="26" y="30" font-size="12" text-anchor="middle" fill="#c084fc">⚡</text>
      <text x="46" y="24" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">AI Coding Agents</text>
      <text x="46" y="38" fill="#94a3b8" class="mono-pill">OpenCode • Cursor • Cline</text>
    </g>

    <!-- Left Floating Card 2: Self-Host Cloud -->
    <g class="floating-2 bg-card" transform="translate(80, 270)">
      <rect width="185" height="52" rx="10" fill="rgba(15, 23, 42, 0.7)" stroke="url(#cardBorder)" stroke-width="1.2"/>
      <circle cx="26" cy="26" r="10" fill="rgba(6, 182, 212, 0.2)"/>
      <text x="26" y="30" font-size="12" text-anchor="middle" fill="#22d3ee">🚢</text>
      <text x="46" y="24" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">Self-Hosted PaaS</text>
      <text x="46" y="38" fill="#94a3b8" class="mono-pill">Coolify • Dokku • Kamal</text>
    </g>

    <!-- Right Floating Card 1: Autonomous Billing -->
    <g class="floating-2 bg-card" transform="translate(950, 80)">
      <rect width="190" height="52" rx="10" fill="rgba(15, 23, 42, 0.7)" stroke="url(#cardBorder)" stroke-width="1.2"/>
      <circle cx="26" cy="26" r="10" fill="rgba(236, 72, 153, 0.2)"/>
      <text x="26" y="30" font-size="12" text-anchor="middle" fill="#f472b6">💳</text>
      <text x="46" y="24" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">Smart Monetization</text>
      <text x="46" y="38" fill="#94a3b8" class="mono-pill">Stripe • Lago • Autumn</text>
    </g>

    <!-- Right Floating Card 2: BaaS & Real-Time DB -->
    <g class="floating-1 bg-card" transform="translate(930, 270)">
      <rect width="195" height="52" rx="10" fill="rgba(15, 23, 42, 0.7)" stroke="url(#cardBorder)" stroke-width="1.2"/>
      <circle cx="26" cy="26" r="10" fill="rgba(34, 197, 94, 0.2)"/>
      <text x="26" y="30" font-size="12" text-anchor="middle" fill="#4ade80">🗄️</text>
      <text x="46" y="24" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">BaaS &amp; Storage</text>
      <text x="46" y="38" fill="#94a3b8" class="mono-pill">Supabase • PocketBase • Appwrite</text>
    </g>

    <!-- Animated Particle Flow Nodes (Connecting lines) -->
    <path d="M 240 106 C 400 106, 500 160, 600 160" fill="none" stroke="rgba(168,85,247,0.2)" stroke-width="1.5" stroke-dasharray="6,6">
      <animate attributeName="stroke-dashoffset" values="48;0" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M 950 106 C 800 106, 700 160, 600 160" fill="none" stroke="rgba(236,72,153,0.2)" stroke-width="1.5" stroke-dasharray="6,6">
      <animate attributeName="stroke-dashoffset" values="0;48" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- FOREGROUND LAYER: ALWAYS IN FOREGROUND & HIGHLY LEGIBLE -->
  <g id="foreground-content" transform="translate(600, 190)" text-anchor="middle">
    <!-- Top Pill Badge -->
    <g transform="translate(0, -95)">
      <rect x="-165" y="-14" width="330" height="28" rx="14" fill="rgba(168, 85, 247, 0.15)" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1"/>
      <circle cx="-146" cy="0" r="4" fill="#a855f7">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="8" y="4" fill="#e9d5ff" class="mono-pill" font-size="11" text-anchor="middle">🦄 ZERO HEADCOUNT • INFINITE LEVERAGE</text>
    </g>

    <!-- Main Title -->
    <text y="-32" class="title-text" font-size="46" fill="#ffffff" filter="url(#subtleGlow)">
      AWESOME ONE-PERSON UNICORN STACK
    </text>
    <text y="-32" class="title-text" font-size="46" fill="url(#unicornGradient)">
      AWESOME ONE-PERSON UNICORN STACK
    </text>

    <!-- Subtitle -->
    <text y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#cbd5e1" letter-spacing="-0.2px">
      Curated Production Infrastructure to Build, Launch &amp; Scale Software Businesses Solo
    </text>

    <!-- Highlighted Badges in Center Foreground -->
    <g transform="translate(0, 65)">
      <!-- Item 1 -->
      <g transform="translate(-250, 0)">
        <rect x="-70" y="-15" width="140" height="30" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
        <text y="5" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600">🤖 AI Coding Agents</text>
      </g>
      <!-- Item 2 -->
      <g transform="translate(-80, 0)">
        <rect x="-70" y="-15" width="140" height="30" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
        <text y="5" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600">⚡ Autonomous BaaS</text>
      </g>
      <!-- Item 3 -->
      <g transform="translate(90, 0)">
        <rect x="-70" y="-15" width="140" height="30" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
        <text y="5" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600">🛡️ Self-Hosted Cloud</text>
      </g>
      <!-- Item 4 -->
      <g transform="translate(260, 0)">
        <rect x="-70" y="-15" width="140" height="30" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
        <text y="5" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600">💰 Zero-Seat Billing</text>
      </g>
    </g>
  </g>

  <!-- Bottom Accent Gradient Line -->
  <rect x="0" y="416" width="1200" height="4" fill="url(#unicornGradient)"/>
</svg>
